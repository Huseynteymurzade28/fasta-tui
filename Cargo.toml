[package]
name = "fasta-tui"
version = "0.1.0"
edition = "2021"
description = "A TUI for visualizing FASTA DNA sequences with a 3D Braille double helix"
authors = ["Huseyn Teymurzade"]
license = "MIT"
repository = "https://github.com/Huseynteymurzade28/fasta-tui"
readme = "README.md"
keywords = ["fasta", "bioinformatics", "tui", "dna", "genomics"]
categories = ["command-line-utilities", "science", "visualization"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
flate2 = "1.0"
ratatui = "0.29"
